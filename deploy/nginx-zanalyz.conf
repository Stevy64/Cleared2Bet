# nginx — site ZanalyZ (Oracle Cloud / VPS)
# 1. Remplace zanalyz.example.com par ton domaine
# 2. sudo ln -s …/nginx-zanalyz.conf /etc/nginx/sites-enabled/zanalyz
# 3. Certbot : sudo certbot --nginx -d ton.domaine
# Sur OCI : ouvrir aussi 80/443 dans la Security List du VCN.

upstream zanalyz_app {
    server unix:/run/zanalyz/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name zanalyz.example.com www.zanalyz.example.com;

    # Certbot remplacera souvent ce bloc par une redirection HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zanalyz.example.com www.zanalyz.example.com;

    # Chemins Let's Encrypt (ajustés par certbot) :
    ssl_certificate     /etc/letsencrypt/live/zanalyz.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zanalyz.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # Static (WhiteNoise gère aussi via Gunicorn ; nginx est plus efficace).
    location /static/ {
        alias /var/www/zanalyz/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://zanalyz_app;
    }
}
