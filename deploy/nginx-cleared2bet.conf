# nginx — site Cleared2Bet (OVH VPS)
# 1. Remplace cleared2bet.example.com par ton domaine
# 2. sudo ln -s /var/www/cleared2bet/deploy/nginx-cleared2bet.conf /etc/nginx/sites-enabled/cleared2bet
# 3. Certbot : sudo certbot --nginx -d ton.domaine

upstream cleared2bet_app {
    server unix:/run/cleared2bet/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name cleared2bet.example.com www.cleared2bet.example.com;

    # Certbot remplacera souvent ce bloc par une redirection HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cleared2bet.example.com www.cleared2bet.example.com;

    # Chemins Let's Encrypt (ajustés par certbot) :
    ssl_certificate     /etc/letsencrypt/live/cleared2bet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleared2bet.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # Static (WhiteNoise gère aussi via Gunicorn ; nginx est plus efficace).
    location /static/ {
        alias /var/www/cleared2bet/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://cleared2bet_app;
    }
}
