# ════════════════════════════════════════════
# Cleared2Bet — production micro-services (OVH)
# Images : cleared2bet-prod, cleared2bet-moteur
# Services : nginx · web · moteur · worker · db · redis
# ════════════════════════════════════════════

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY obligatoire}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_SSL: ${DJANGO_SSL:-0}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
  DJANGO_DB_URL: postgres://${POSTGRES_USER:-cleared2bet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cleared2bet}
  GUNICORN_BIND: 0.0.0.0:8000
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  C2B_WHATSAPP_PHONE: ${C2B_WHATSAPP_PHONE:-}
  C2B_MOTEUR_URL: ${C2B_MOTEUR_URL:-http://moteur:8001}
  C2B_REDIS_URL: ${C2B_REDIS_URL:-redis://redis:6379/0}

services:
  db:
    image: postgres:16-alpine
    container_name: cleared2bet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cleared2bet}
      POSTGRES_USER: ${POSTGRES_USER:-cleared2bet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
    volumes:
      - cleared2bet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cleared2bet} -d ${POSTGRES_DB:-cleared2bet}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - cleared2bet-net

  redis:
    image: redis:7-alpine
    container_name: cleared2bet-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cleared2bet-net

  moteur:
    build:
      context: .
      dockerfile: Dockerfile
      target: moteur
    image: cleared2bet-moteur:latest
    container_name: cleared2bet-moteur
    restart: unless-stopped
    environment:
      C2B_SKIP_MIGRATE: "1"
      C2B_SKIP_COLLECTSTATIC: "1"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - cleared2bet-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: cleared2bet-prod:latest
    container_name: cleared2bet-web
    restart: unless-stopped
    environment:
      <<: *django-env
    volumes:
      - cleared2bet_static:/app/staticfiles
      - cleared2bet_data:/app/data
      - cleared2bet_media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      moteur:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 50s
    networks:
      - cleared2bet-net

  worker:
    image: cleared2bet-prod:latest
    container_name: cleared2bet-worker
    restart: unless-stopped
    environment:
      <<: *django-env
      C2B_SKIP_COLLECTSTATIC: "1"
      C2B_WORKER_INTERVAL: ${C2B_WORKER_INTERVAL:-7200}
      C2B_SYNC_PAGES: ${C2B_SYNC_PAGES:-1}
      C2B_SYNC_PASSES: ${C2B_SYNC_PASSES:-1}
      C2B_SYNC_CONTEXTE: ${C2B_SYNC_CONTEXTE:-0}
      C2B_REDIS_URL: ${C2B_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - cleared2bet_data:/app/data
      - cleared2bet_media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      moteur:
        condition: service_healthy
      web:
        condition: service_started
    entrypoint: ["sh", "/app/deploy/docker-entrypoint.sh"]
    command: ["sh", "/app/deploy/worker-loop.sh"]
    networks:
      - cleared2bet-net

  nginx:
    image: nginx:1.27-alpine
    container_name: cleared2bet-nginx
    restart: unless-stopped
    ports:
      - "${C2B_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - cleared2bet_static:/var/www/static:ro
      - cleared2bet_media:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - cleared2bet-net

volumes:
  cleared2bet_pg_data:
  cleared2bet_static:
  cleared2bet_data:
  cleared2bet_media:

networks:
  cleared2bet-net:
    driver: bridge
    name: cleared2bet-net
