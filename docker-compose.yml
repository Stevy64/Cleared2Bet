# ════════════════════════════════════════════
# Cleared2Bet — production (OVH Cloud / VPS Docker)
# Usage : make prod   |  docker compose up -d
# Images : cleared2bet-prod, postgres, nginx
# ════════════════════════════════════════════

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY obligatoire}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_SSL: ${DJANGO_SSL:-0}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
  DJANGO_DB_URL: postgres://${POSTGRES_USER:-cleared2bet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cleared2bet}
  GUNICORN_BIND: 0.0.0.0:8000
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  C2B_WHATSAPP_PHONE: ${C2B_WHATSAPP_PHONE:-}

services:
  db:
    image: postgres:16-alpine
    container_name: cleared2bet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cleared2bet}
      POSTGRES_USER: ${POSTGRES_USER:-cleared2bet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
    volumes:
      - cleared2bet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cleared2bet} -d ${POSTGRES_DB:-cleared2bet}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - cleared2bet-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: cleared2bet-prod:latest
    container_name: cleared2bet-web
    restart: unless-stopped
    environment:
      <<: *django-env
    volumes:
      - cleared2bet_static:/app/staticfiles
      - cleared2bet_data:/app/data
      - cleared2bet_media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 50s
    networks:
      - cleared2bet-net

  nginx:
    image: nginx:1.27-alpine
    container_name: cleared2bet-nginx
    restart: unless-stopped
    ports:
      - "${C2B_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - cleared2bet_static:/var/www/static:ro
      - cleared2bet_media:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - cleared2bet-net

volumes:
  cleared2bet_pg_data:
  cleared2bet_static:
  cleared2bet_data:
  cleared2bet_media:

networks:
  cleared2bet-net:
    driver: bridge
    name: cleared2bet-net
