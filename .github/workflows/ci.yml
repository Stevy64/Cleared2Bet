name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & contrôles prod
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use-please-rotate-locally-xx
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SSL: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check (mode prod)
        run: python manage.py check --deploy

      - name: Validate migrations
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Collect static files
        run: python manage.py collectstatic --noinput --clear

      - name: Compile Python sources
        run: python -m compileall -q config paris manage.py

      - name: Run pytest
        run: pytest --tb=short

  pythonanywhere-smoke:
    name: Smoke PythonAnywhere
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: pa-smoke-secret-key-not-for-production-use-please-rotate-locally-xx
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: stevy64.pythonanywhere.com,localhost,127.0.0.1,testserver
      DJANGO_SSL: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prod checks for PythonAnywhere host
        run: |
          python manage.py check --deploy
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.conf import settings
          assert settings.DEBUG is False
          assert not settings.SECRET_KEY.startswith("django-insecure-")
          assert "stevy64.pythonanywhere.com" in settings.ALLOWED_HOSTS
          print("PythonAnywhere prod smoke OK")
          PY
