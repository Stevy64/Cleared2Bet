# ════════════════════════════════════════════
# ZanalyZ — développement micro-services
# make dev-build  |  docker compose -f docker-compose.dev.yml up --build
# ════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    container_name: zanalyz-redis-dev
    restart: unless-stopped
    networks:
      - zanalyz-dev-net

  moteur:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: zanalyz-dev:latest
    container_name: zanalyz-moteur-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
      ZANALYZ_SKIP_MIGRATE: "1"
      ZANALYZ_SKIP_COLLECTSTATIC: "1"
    # builder n’a pas d’entrypoint django obligatoire — uvicorn direct
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["moteur_service.app:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    ports:
      - "${ZANALYZ_MOTEUR_PORT:-8001}:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - zanalyz-dev-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: zanalyz-dev:latest
    container_name: zanalyz-web-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - zanalyz_dev_static:/app/staticfiles
      - zanalyz_dev_data:/app/data
      - zanalyz_dev_media:/app/media
    ports:
      - "${ZANALYZ_DEV_PORT:-8000}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-zanalyz-secret-local-only}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DJANGO_SSL: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SQLITE_PATH: /app/data/db.sqlite3
      ZANALYZ_SKIP_COLLECTSTATIC: "1"
      ZANALYZ_MOTEUR_URL: http://moteur:8001
      ZANALYZ_REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      moteur:
        condition: service_healthy
    networks:
      - zanalyz-dev-net

  worker:
    image: zanalyz-dev:latest
    container_name: zanalyz-worker-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - zanalyz_dev_data:/app/data
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-zanalyz-secret-local-only}
      DJANGO_SQLITE_PATH: /app/data/db.sqlite3
      ZANALYZ_SKIP_MIGRATE: "1"
      ZANALYZ_SKIP_COLLECTSTATIC: "1"
      ZANALYZ_MOTEUR_URL: http://moteur:8001
      ZANALYZ_REDIS_URL: redis://redis:6379/0
      ZANALYZ_WORKER_INTERVAL: ${ZANALYZ_WORKER_INTERVAL:-7200}
      ZANALYZ_SYNC_PAGES: "1"
      ZANALYZ_SYNC_PASSES: "1"
      ZANALYZ_SYNC_CONTEXTE: "0"
      PYTHONUNBUFFERED: "1"
    entrypoint: ["sh", "/app/deploy/worker-loop.sh"]
    depends_on:
      web:
        condition: service_healthy
      moteur:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - worker
    networks:
      - zanalyz-dev-net

volumes:
  zanalyz_dev_static:
  zanalyz_dev_data:
  zanalyz_dev_media:

networks:
  zanalyz-dev-net:
    driver: bridge
    name: zanalyz-dev-net
